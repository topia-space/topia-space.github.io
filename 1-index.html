n the constellation Serpens."]},{"key":"comet67p","name":"COMET 67P","kind":"COMET","facts":["ESA's Rosetta orbited it from 2014 to 2016.","The Philae lander touched down in November 2014.","It is about 4 km across, shaped like a duck.","It orbits the Sun every 6.4 years.","Rosetta found water ice and organic molecules.","It is a Jupiter-family comet."]},{"key":"venus","name":"VENUS","kind":"PLANET","facts":["Hottest planet at about 465 C, hot enough to melt lead.","Its CO2 atmosphere presses 92 times harder than Earth's.","A Venus day is longer than its year.","Clouds of sulphuric acid hide the surface completely.","It spins backwards compared with almost every other planet.","Soviet Venera landers survived only about an hour on its surface."]},{"key":"sirius","name":"SIRIUS","kind":"STAR","facts":["The brightest star in Earth's night sky.","It is 8.6 light-years away.","It has a white dwarf companion, Sirius B.","Its brightness comes from size and closeness, not rarity.","It is in the constellation Canis Major.","Ancient Egyptians timed the Nile flood by its rising."]},{"key":"crabneb","name":"CRAB NEBULA","kind":"NEBULA","facts":["The wreck of a supernova seen in 1054 AD.","It is 6,500 light-years away in Taurus.","A pulsar spins 30 times a second at its centre.","Chinese astronomers recorded the explosion.","It expands at about 1,500 km/s.","It is about 11 light-years across."]},{"key":"halebopp","name":"COMET HALE-BOPP","kind":"COMET","facts":["It was visible to the naked eye for 18 months in 1996-97.","Its tail stretched over 100 million km.","It will not return for about 2,500 years.","It was discovered in July 1995.","It was one of the brightest comets of the 20th century.","It was seen by billions of people."]},{"key":"earth","name":"EARTH","kind":"PLANET","facts":["The only world known to hold life.","71% of its surface is covered by water.","The ISS circles it at 28,000 km/h, about 425 km up.","Its magnetic field deflects the solar wind.","Earth is 1 AU from the Sun, about 150 million km.","The Moon formed from debris of a giant impact 4.5 billion years ago."]},{"key":"barnard","name":"BARNARD'S STAR","kind":"STAR","facts":["A red dwarf 5.96 light-years away.","It moves faster across our sky than any other star.","It will pass within 3.8 light-years in about 10,000 years.","It is far too faint to see without a telescope.","Astronomers long suspected planets around it.","A small planet was confirmed there in 2024."]},{"key":"carinaneb","name":"CARINA NEBULA","kind":"NEBULA","facts":["One of the largest and brightest nebulae in the sky.","It is about 7,500 light-years away.","It contains the hypergiant star Eta Carinae.","Its gas spans over 300 light-years.","The Homunculus Nebula sits inside it.","It is too far south for most northern observers."]},{"key":"neowise","name":"COMET NEOWISE","kind":"COMET","facts":["It lit up northern skies in July 2020.","It was found by a NASA infrared telescope in March 2020.","Its dust tail stretched 20 degrees across the sky.","It orbits the Sun about every 6,800 years.","It survived its closest pass to the Sun.","It was the brightest comet since Hale-Bopp."]},{"key":"mars","name":"MARS","kind":"PLANET","facts":["Olympus Mons rises 22 km, nearly three Everests.","Its two small moons are Phobos and Deimos.","A day on Mars lasts 24 hours 37 minutes.","Dust storms can wrap the whole planet for weeks.","Its thin CO2 atmosphere is under 1% of Earth's pressure.","Ancient river valleys show water once flowed there."]},{"key":"betelgeuse","name":"BETELGEUSE","kind":"STAR","facts":["A red supergiant in Orion, about 550 light-years away.","If placed at the Sun, it would swallow Mars' orbit.","It dimmed sharply in 2019 and 2020 from a dust cloud.","It will explode as a supernova within 100,000 years.","It is one of the largest stars visible to the naked eye.","Its name comes from Arabic, meaning the giant's shoulder."]},{"key":"lagoonneb","name":"LAGOON NEBULA","kind":"NEBULA","facts":["A bright nebula in Sagittarius, 4,100 light-years away.","A dark lane splits it in two.","It is visible to the naked eye from dark sites.","It hosts a young cluster called NGC 6530.","It is about 110 light-years across.","It is a favourite target for amateur telescopes."]},{"key":"apophis","name":"ASTEROID 99942 APOPHIS","kind":"ASTEROID","facts":["A 340-metre asteroid that will pass close in 2029.","In April 2029 it will come within 32,000 km of Earth.","That is closer than some satellites.","It was once thought to pose an impact risk.","Impacts are now ruled out for at least 100 years.","It will be visible to the naked eye in 2029."]},{"key":"jupiter","name":"JUPITER","kind":"PLANET","facts":["Eleven Earths wide, it is the largest planet.","The Great Red Spot is a storm wider than Earth.","It spins once every 9 hours 55 minutes.","It has 95 confirmed moons.","Its gravity shields the inner planets from many comets.","Juno has orbited it since 2016, studying its interior."]},{"key":"rigel","name":"RIGEL","kind":"STAR","facts":["A blue supergiant marking Orion's foot.","About 860 light-years away.","It shines roughly 100,000 times brighter than the Sun.","It is the seventh brightest star in the night sky.","It has a faint companion star.","It is far hotter than the Sun, near 12,000 C."]},{"key":"trifidneb","name":"TRIFID NEBULA","kind":"NEBULA","facts":["Its dust lanes split it into three lobes.","It is about 5,000 light-years away.","It glows red from hydrogen and blue from reflection.","New stars are forming in its dense cores.","It lies in the constellation Sagittarius.","Charles Messier catalogued it in 1764."]},{"key":"bennu","name":"BENNU","kind":"ASTEROID","facts":["A 500-metre asteroid shaped like a spinning top.","OSIRIS-REx returned samples from it in 2023.","Those samples contain carbon and water-bearing minerals.","It orbits the Sun every 1.2 years.","It has a small chance of hitting Earth in the 2100s.","Its surface is loose rubble, not solid rock."]},{"key":"saturn","name":"SATURN","kind":"PLANET","facts":["Rings 280,000 km across, mostly water ice.","Less dense than water: it would float.","A year there lasts 29.5 Earth years.","Titan is its largest moon, with lakes of methane.","Enceladus sprays water from a hidden ocean.","Cassini studied it for 13 years before diving into it in 2017."]},{"key":"vega","name":"VEGA","kind":"STAR","facts":["The brightest star in Lyra and the fifth brightest in the sky.","It is 25 light-years away.","It was the pole star about 12,000 years ago.","It spins so fast it is noticeably flattened.","It is surrounded by a disc of dust.","It was the first star ever photographed, in 1850."]},{"key":"horsehead","name":"HORSEHEAD NEBULA","kind":"NEBULA","facts":["A dark cloud shaped like a horse's head.","It is about 1,375 light-years away.","It is silhouetted against glowing hydrogen.","It is part of the Orion molecular cloud.","It will erode away within a few million years.","It is only visible in long photographs."]},{"key":"ryugu","name":"RYUGU","kind":"ASTEROID","facts":["A diamond-shaped asteroid about 900 m across.","Japan's Hayabusa2 returned samples in 2020.","The samples contained amino acids.","It orbits the Sun every 1.3 years.","Its surface is covered in boulders.","It is a carbon-rich asteroid."]},{"key":"uranus","name":"URANUS","kind":"PLANET","facts":["It rolls on its side, tilted 98 degrees.","Methane gives it its pale blue-green colour.","A year lasts 84 Earth years.","It was the first planet found with a telescope, in 1781.","Its 13 rings are dark and narrow.","Only one spacecraft has passed: Voyager 2, in 1986."]},{"key":"polaris","name":"POLARIS","kind":"STAR","facts":["The North Star, sitting almost above Earth's north pole.","It is about 430 light-years away.","Its height above the horizon gives your latitude.","It is a yellow supergiant, many times the Sun's size.","It pulses slowly in brightness.","It is actually a triple star system."]},{"key":"helixneb","name":"HELIX NEBULA","kind":"NEBULA","facts":["A planetary nebula 650 light-years away.","It looks like a giant eye in Aquarius.","It formed when a Sun-like star shed its outer layers.","It spans about 2.5 light-years.","A white dwarf sits at its centre.","It is one of the closest planetary nebulae."]},{"key":"itokawa","name":"ITOKAWA","kind":"ASTEROID","facts":["A 535 m long asteroid shaped like a sea otter.","Japan's Hayabusa returned samples in 2010.","It was the first asteroid sampled and returned.","Its surface is rubble, not solid.","It orbits the Sun every 1.5 years.","Dust from it was found in the samples."]},{"key":"neptune","name":"NEPTUNE","kind":"PLANET","facts":["Windiest world known, with gusts over 2,000 km/h.","A year lasts 165 Earth years.","It was found by mathematics before it was seen, in 1846.","Its moon Triton orbits backwards and is probably captured.","Sunlight there is about 900 times fainter than on Earth.","Voyager 2 is the only visitor, in 1989."]},{"key":"arcturus","name":"ARCTURUS","kind":"STAR","facts":["A red giant 37 light-years away.","The brightest star in the northern celestial hemisphere.","It is about 25 times wider than the Sun.","It is racing through the galaxy on an unusual orbit.","It is in the constellation Bootes.","It is around 7 billion years old."]},{"key":"ringneb","name":"RING NEBULA","kind":"NEBULA","facts":["A planetary nebula in Lyra, 2,600 light-years away.","It looks like a smoke ring through a telescope.","Its central star is a white dwarf.","The ring is expanding at about 30 km/s.","It was the first planetary nebula ever identified.","It formed roughly 7,000 years ago."]},{"key":"hygiea","name":"HYGIEA","kind":"ASTEROID","facts":["The fourth largest asteroid, about 430 km across.","It may be round enough to count as a dwarf planet.","It is the main member of its own asteroid family.","Its surface is very dark.","It was discovered in 1849.","One orbit takes 5.6 Earth years."]},{"key":"pluto","name":"PLUTO","kind":"DWARF","facts":["Smaller than Earth's Moon, 2,377 km across.","Reclassified as a dwarf planet in 2006.","New Horizons flew past in July 2015.","It has a heart-shaped plain of nitrogen ice, Sputnik Planitia.","Its largest moon Charon is half its own width.","One orbit takes 248 Earth years."]},{"key":"aldebaran","name":"ALDEBARAN","kind":"STAR","facts":["The eye of Taurus, 65 light-years away.","An orange giant about 44 times the Sun's width.","The Pioneer probes were aimed toward it.","It appears among the Hyades cluster but is much closer.","Its name means the follower, as it follows the Pleiades.","It is one of the easiest stars to identify by colour."]},{"key":"cats eye","name":"CAT'S EYE NEBULA","kind":"NEBULA","facts":["A complex planetary nebula 3,300 light-years away.","It shows nested shells of glowing gas.","Hubble images revealed knots and jets.","Its central star is extremely hot.","It lies in the constellation Draco.","It is about half a light-year across."]},{"key":"chiron","name":"2060 CHIRON","kind":"COMET","facts":["A centaur, orbiting between Saturn and Uranus.","It shows both comet and asteroid features.","It is about 200 km across.","It orbits the Sun every 50 years.","It has a faint coma of gas and dust.","It was discovered in 1977."]},{"key":"ceres","name":"CERES","kind":"DWARF","facts":["Largest object in the asteroid belt, 940 km across.","The only dwarf planet inside Neptune's orbit.","Dawn orbited it from 2015 to 2018.","Bright salt deposits sit in Occator crater.","It may hold a layer of briny water ice.","Discovered in 1801, it was first called a planet."]},{"key":"antares","name":"ANTARES","kind":"STAR","facts":["A red supergiant, the heart of Scorpius.","About 550 light-years away.","Roughly 700 times the Sun's radius.","Its name means rival of Mars, from its red colour.","It has a blue companion star.","It will end as a supernova."]},{"key":"rosetteneb","name":"ROSETTE NEBULA","kind":"NEBULA","facts":["A star-forming region 5,200 light-years away.","It looks like a rose with a hollow centre.","Radiation from young stars has cleared that centre.","It spans about 130 light-years.","It lies in the constellation Monoceros.","It is a popular target in hydrogen-alpha light."]},{"key":"vestafam","name":"ASTEROID BELT","kind":"REGION","facts":["A ring of rocky bodies between Mars and Jupiter.","It holds millions of objects over 1 km across.","Its total mass is less than 4% of the Moon's.","Jupiter's gravity kept it from forming a planet.","Ceres is its largest member.","Spacecraft cross it safely; the gaps are vast."]},{"key":"eris","name":"ERIS","kind":"DWARF","facts":["Its discovery in 2005 led to the dwarf planet definition.","Slightly smaller than Pluto but about 27% heavier.","One orbit takes 558 Earth years.","Its moon is called Dysnomia.","It is currently near its farthest point, about 96 AU away.","Its surface is methane ice, bright and reflective."]},{"key":"deneb","name":"DENEB","kind":"STAR","facts":["One of the most luminous stars visible to the naked eye.","It marks the tail of Cygnus the swan.","It is about 2,600 light-years away.","It shines near 200,000 times brighter than the Sun.","It forms the Summer Triangle with Vega and Altair.","It is a blue-white supergiant."]},{"key":"veilneb","name":"VEIL NEBULA","kind":"NEBULA","facts":["The remains of a supernova that exploded 10,000 years ago.","It is about 2,400 light-years away.","Its filaments span nearly 3 degrees of sky.","It is expanding at around 350 km/s.","It lies in Cygnus, behind the Milky Way's disc.","Its glow is mostly ionised oxygen and hydrogen."]},{"key":"kuiperbelt","name":"KUIPER BELT","kind":"REGION","facts":["A belt of icy bodies beyond Neptune.","It starts around 30 AU from the Sun.","Pluto, Haumea and Makemake belong to it.","It holds hundreds of thousands of objects over 100 km.","It is the source of short-period comets.","New Horizons flew through part of it."]},{"key":"haumea","name":"HAUMEA","kind":"DWARF","facts":["It spins once every 4 hours, the fastest of any large body.","That spin stretches it into an egg shape.","It has a thin ring, found in 2017.","Two moons, Hi'iaka and Namaka, orbit it.","It sits beyond Neptune in the Kuiper Belt.","Its surface is water ice, unusually bright."]},{"key":"spica","name":"SPICA","kind":"STAR","facts":["The brightest star in Virgo.","It is 250 light-years away.","It is actually two hot blue stars orbiting closely.","Their gravity distorts each other into egg shapes.","It is about 20,000 times brighter than the Sun.","Hipparchus recorded it over 2,000 years ago."]},{"key":"coneneb","name":"CONE NEBULA","kind":"NEBULA","facts":["A dark pillar in Monoceros, 2,700 light-years away.","It is about 7 light-years long.","Hydrogen glows behind its dusty silhouette.","Stars are forming inside the cone.","It was discovered in 1784.","It is part of the Christmas Tree cluster."]},{"key":"oortcloud","name":"OORT CLOUD","kind":"REGION","facts":["A vast shell of icy bodies far beyond the planets.","It may stretch from 2,000 to 100,000 AU.","It is the source of long-period comets.","No object in it has ever been seen directly.","It has never been visited by a spacecraft.","Its existence is inferred from comet orbits."]},{"key":"makemake","name":"MAKEMAKE","kind":"DWARF","facts":["Discovered in 2005, named after a Rapa Nui creator god.","About 1,430 km across, two thirds the size of Pluto.","One orbit takes 306 Earth years.","It has one known moon, MK 2.","Methane ice covers its surface.","It is the second brightest Kuiper Belt object known."]},{"key":"capella","name":"CAPELLA","kind":"STAR","facts":["The sixth brightest star in the night sky.","It is 43 light-years away in Auriga.","It is really four stars in two pairs.","The two main stars are yellow giants.","It never sets from most northern latitudes.","Its name means the little she-goat."]},{"key":"bubbleneb","name":"BUBBLE NEBULA","kind":"NEBULA","facts":["A shell of gas 11,000 light-years away.","It was blown out by a hot young star.","It spans about 10 light-years.","It is expanding at about 30 km/s.","It lies in the constellation Cassiopeia.","It was discovered in 1787."]},{"key":"heliopause","name":"HELIOPAUSE","kind":"REGION","facts":["The boundary where the Sun's wind meets interstellar space.","Voyager 1 crossed it in 2012.","Voyager 2 crossed it in 2018.","It sits about 120 AU from the Sun.","Beyond it lies the interstellar medium.","It is not a sharp wall but a turbulent zone."]},{"key":"vesta","name":"VESTA","kind":"ASTEROID","facts":["About 525 km across, second most massive asteroid.","Bright enough to see with the naked eye on a dark night.","A giant crater covers its south pole.","Dawn orbited it in 2011 and 2012.","Many meteorites on Earth come from Vesta.","One orbit takes 3.6 Earth years."]},{"key":"trappist1","name":"TRAPPIST-1","kind":"STAR","facts":["An ultracool red dwarf 40 light-years away.","Seven Earth-sized planets circle it.","Three of those planets sit in the habitable zone.","The star is only slightly larger than Jupiter.","Its planets huddle closer than Mercury does to the Sun.","It was found by the TRAPPIST telescope in Chile."]},{"key":"northamerica","name":"NORTH AMERICA NEBULA","kind":"NEBULA","facts":["Its shape resembles the North American continent.","It is about 2,600 light-years away.","It spans about 100 light-years.","It is part of the same cloud as the Pelican Nebula.","It is visible with binoculars from dark sites.","It lies in Cygnus."]},{"key":"asteroid16psyche","name":"MAGNETIC FIELD OF EARTH","kind":"REGION","facts":["Earth's field is generated by its molten iron core.","It deflects most of the solar wind.","It channels charged particles to the poles, making auroras.","It flips direction every few hundred thousand years.","Compasses work because of it.","It extends tens of thousands of km into space."]},{"key":"pallas","name":"PALLAS","kind":"ASTEROID","facts":["Third most massive asteroid, about 510 km across.","Its orbit is tilted 35 degrees, unusual for the belt.","Discovered in 1802 by Heinrich Olbers.","Its surface is cratered and dark.","It has never been visited by a spacecraft.","One orbit takes 4.6 Earth years."]},{"key":"trappist1e","name":"TRAPPIST-1e","kind":"EXOPLANET","facts":["An Earth-sized planet in the habitable zone.","It orbits its star every 6.1 days.","It is 40 light-years from Earth.","It probably keeps one face toward its star.","Its density suggests a rocky world.","It is a top target for atmospheric study."]},{"key":"flamingstar","name":"FLAMING STAR NEBULA","kind":"NEBULA","facts":["It glows around the runaway star AE Aurigae.","It is about 1,500 light-years away.","The star is moving so fast it lights up the dust it passes.","It lies in the constellation Auriga.","Its colours are orange and blue.","It is a reflection nebula, not a star-forming one."]},{"key":"aurora","name":"AURORA","kind":"REGION","facts":["Auroras glow when solar particles hit the atmosphere.","Oxygen gives green and red light, nitrogen gives blue.","They circle the poles in oval bands.","A strong solar storm pushes them toward the equator.","They appear 100 to 300 km above the ground.","Jupiter and Saturn have auroras too."]},{"key":"psyche","name":"PSYCHE","kind":"ASTEROID","facts":["A metal-rich asteroid about 226 km across.","NASA's Psyche probe launched in 2023 to orbit it.","It may be the exposed core of a shattered protoplanet.","Radar shows a surface dense with iron and nickel.","It orbits the Sun between Mars and Jupiter.","Arrival at the asteroid is planned for 2029."]},{"key":"proximab","name":"PROXIMA B","kind":"EXOPLANET","facts":["The nearest known exoplanet, 4.24 light-years away.","It orbits in its star's habitable zone.","It is at least 1.1 times Earth's mass.","One year there lasts 11.2 days.","Its star's flares may strip any atmosphere.","It was announced in 2016."]},{"key":"tarantula","name":"TARANTULA NEBULA","kind":"NEBULA","facts":["The largest star-forming region in the Local Group.","It sits in the Large Magellanic Cloud.","It is about 160,000 light-years away.","It is over 600 light-years across.","It hosts some of the most massive stars known.","Its core holds a dense cluster of hot stars."]},{"key":"moonio2","name":"AMALTHEA","kind":"MOON","facts":["A small inner moon of Jupiter, 167 km across.","It orbits inside Io's path.","It is reddish and irregularly shaped.","It was discovered in 1892.","It supplies dust to Jupiter's ring.","It orbits Jupiter in under 12 hours."]},{"key":"eros","name":"EROS","kind":"ASTEROID","facts":["A 34 km long peanut-shaped near-Earth asteroid.","NEAR Shoemaker landed on it in 2001.","It was the first asteroid ever orbited.","It passes within 26 million km of Earth at closest.","Its gravity is far too weak to stand on comfortably.","One orbit takes 1.76 Earth years."]},{"key":"fiftyonepeg","name":"51 PEGASI B","kind":"EXOPLANET","facts":["The first exoplanet found around a Sun-like star.","Announced in 1995, it earned a Nobel Prize.","It is a hot Jupiter, half Jupiter's mass.","It orbits in just 4.2 days.","It sits 50 light-years away.","Its discovery changed how planets were thought to form."]},{"key":"boomerang","name":"BOOMERANG NEBULA","kind":"NEBULA","facts":["One of the coldest places found in nature.","It is about 5,000 light-years away.","Its temperature is near -272 C.","It is a pre-planetary nebula, a dying star's outflow.","It is expanding rapidly and cooling as it does.","It lies in the constellation Centaurus."]},{"key":"hyperion","name":"HYPERION","kind":"MOON","facts":["A spongy-looking moon of Saturn, 270 km across.","Its surface is full of deep craters.","It tumbles chaotically as it orbits.","It is mostly water ice with high porosity.","Cassini imaged it in 2005.","It orbits Saturn every 21 days."]},{"key":"ida","name":"IDA","kind":"ASTEROID","facts":["A 31 km asteroid in the main belt.","Galileo photographed it in 1993.","It has a small moon, Dactyl.","Dactyl was the first moon found around an asteroid.","Its surface is covered in craters.","One orbit takes 4.8 Earth years."]},{"key":"kepler452b","name":"KEPLER-452B","kind":"EXOPLANET","facts":["Nicknamed Earth's older cousin.","It orbits a Sun-like star every 385 days.","It is about 1,400 light-years away.","Its star is 1.5 billion years older than the Sun.","It is roughly 1.6 times Earth's size.","It was confirmed in 2015."]},{"key":"omegacen","name":"OMEGA CENTAURI","kind":"CLUSTER","facts":["The largest globular cluster orbiting the Milky Way.","It holds about 10 million stars.","It is 17,000 light-years away.","It is visible to the naked eye as a fuzzy star.","It may be the core of a small galaxy the Milky Way absorbed.","It is about 12 billion years old."]},{"key":"proteus","name":"PROTEUS","kind":"MOON","facts":["A dark, box-shaped moon of Neptune.","It is about 420 km across.","It is one of the darkest objects in the solar system.","Voyager 2 photographed it in 1989.","It orbits Neptune every 27 hours.","It is Neptune's second largest moon."]},{"key":"sedna","name":"SEDNA","kind":"DWARF","facts":["One of the most distant known solar system objects.","Its closest approach is 76 AU, far beyond Pluto.","One orbit takes about 11,400 Earth years.","Discovered in 2003, it is reddish in colour.","No spacecraft has ever visited it.","Its size is roughly 1,000 km across."]},{"key":"hd189733b","name":"HD 189733 B","kind":"EXOPLANET","facts":["A hot Jupiter 64 light-years away.","Winds there may reach 8,700 km/h.","Its atmosphere has been found to contain water.","It orbits in 2.2 days, extremely close to its star.","Glass particles may rain sideways in its clouds.","It was one of the first exoplanets with a mapped atmosphere."]},{"key":"pleiades","name":"PLEIADES","kind":"CLUSTER","facts":["A young cluster of hot blue stars, 444 light-years away.","It is also called the Seven Sisters.","It is one of the easiest clusters to see by eye.","Its stars formed about 100 million years ago.","It is wrapped in a faint blue reflection nebula.","It appears in myths on every continent."]},{"key":"nereid","name":"NEREID","kind":"MOON","facts":["A small moon of Neptune with a wild orbit.","Its distance from Neptune varies by a factor of seven.","It is about 340 km across.","It was discovered in 1949.","It may be a captured object.","It takes nearly an Earth year to orbit Neptune."]},{"key":"moon","name":"THE MOON","kind":"MOON","facts":["It is 384,400 km from Earth on average.","It drifts 3.8 cm further away every year.","It always shows Earth the same face.","Its gravity raises the ocean tides.","Twelve people have walked on it, between 1969 and 1972.","Its far side has thicker crust than the near side."]},{"key":"k218b","name":"K2-18 B","kind":"EXOPLANET","facts":["A sub-Neptune 124 light-years away.","Water vapour was detected in its atmosphere in 2019.","It sits in its star's habitable zone.","It is about 8.6 times Earth's mass.","One year there lasts 33 days.","Carbon-bearing molecules were reported in 2023."]},{"key":"hyades","name":"HYADES","kind":"CLUSTER","facts":["The nearest open cluster, about 150 light-years away.","It forms the V shape of Taurus' head.","It is around 600 million years old.","Aldebaran appears among it but lies much closer.","It spans about 60 light-years.","It is slowly drifting apart."]},{"key":"dione","name":"DIONE","kind":"MOON","facts":["A bright icy moon of Saturn, 1,123 km across.","Its surface has bright wispy terrain.","Those wisps are ice cliffs, not cracks.","Cassini found a thin oxygen atmosphere there.","It orbits Saturn every 2.7 days.","Giovanni Cassini discovered it in 1684."]},{"key":"io","name":"IO","kind":"MOON","facts":["The most volcanically active body in the solar system.","It has over 400 active volcanoes.","Jupiter's tides knead its interior and melt it.","Its surface is painted yellow and orange by sulphur.","Plumes rise up to 300 km above it.","Galileo discovered it in 1610."]},{"key":"gj1214b","name":"GJ 1214 B","kind":"EXOPLANET","facts":["A water-rich world 48 light-years away.","It is about 2.7 times Earth's radius.","Its thick haze hid its atmosphere for years.","It orbits a small red star every 1.6 days.","JWST measured its atmosphere in 2024.","It is one of the best-studied mini-Neptunes."]},{"key":"andromeda","name":"ANDROMEDA GALAXY","kind":"GALAXY","facts":["The nearest large galaxy, 2.5 million light-years away.","It is on a collision course with the Milky Way.","They will merge in about 4.5 billion years.","It holds roughly one trillion stars.","It is visible to the naked eye from dark skies.","It is catalogued as M31."]},{"key":"tethys","name":"TETHYS","kind":"MOON","facts":["An icy moon of Saturn, 1,060 km across.","A huge crater, Odysseus, spans 450 km.","A canyon 2,000 km long runs across it.","It is almost entirely water ice.","It orbits Saturn every 1.9 days.","It was discovered in 1684."]},{"key":"europa","name":"EUROPA","kind":"MOON","facts":["An ocean of liquid water hides under its ice.","That ocean may hold twice Earth's water.","Its surface is the smoothest in the solar system.","Cracks in the ice stretch for thousands of km.","NASA's Europa Clipper launched in 2024.","It is slightly smaller than Earth's Moon."]},{"key":"waspl2b","name":"WASP-12 B","kind":"EXOPLANET","facts":["One of the hottest exoplanets known.","Its day side reaches about 2,500 C.","It is being torn apart by its star.","It orbits in just over one day.","It is about 1,400 light-years away.","Its shape is stretched into an egg."]},{"key":"milkyway","name":"MILKY WAY","kind":"GALAXY","facts":["Our home galaxy, about 100,000 light-years across.","It holds 100 to 400 billion stars.","The Sun orbits its centre every 230 million years.","A supermassive black hole sits at its heart.","It is a barred spiral galaxy.","It belongs to the Local Group of galaxies."]},{"key":"ariel","name":"ARIEL","kind":"MOON","facts":["The brightest of Uranus' large moons.","It is 1,158 km across.","Deep canyons cut across its surface.","Voyager 2 imaged only part of it in 1986.","It orbits Uranus every 2.5 days.","It was discovered in 1851."]},{"key":"ganymede","name":"GANYMEDE","kind":"MOON","facts":["The largest moon in the solar system.","Bigger than the planet Mercury.","The only moon known to have its own magnetic field.","Its surface mixes old dark terrain with young grooves.","ESA's JUICE probe is on its way, arriving in 2031.","It orbits Jupiter in about 7 days."]},{"key":"hubble","name":"HUBBLE SPACE TELESCOPE","kind":"SPACECRAFT","facts":["It has orbited Earth since 1990.","Its deep fields revealed thousands of galaxies.","It helped pin the universe's age at 13.8 billion years.","Five servicing missions repaired and upgraded it.","It orbits about 540 km above Earth.","It still works alongside JWST."]},{"key":"triangulum","name":"TRIANGULUM GALAXY","kind":"GALAXY","facts":["The third largest galaxy in the Local Group.","It is 2.7 million light-years away.","It is catalogued as M33.","It has a bright star-forming region, NGC 604.","It may be a satellite of Andromeda.","It is a face-on spiral, easy to study."]},{"key":"umbriel","name":"UMBRIEL","kind":"MOON","facts":["The darkest of Uranus' large moons.","It is 1,169 km across.","A bright ring sits near its north pole.","Its surface is ancient and cratered.","It orbits Uranus every 4.1 days.","It was discovered in 1851."]},{"key":"callisto","name":"CALLISTO","kind":"MOON","facts":["The most heavily cratered object known.","Its surface is 4 billion years old.","It orbits beyond Jupiter's strongest radiation belts.","It is nearly the size of Mercury.","An ocean may lie deep beneath its ice.","Galileo spotted it in 1610."]},{"key":"jwst","name":"JAMES WEBB SPACE TELESCOPE","kind":"SPACECRAFT","facts":["The largest telescope ever launched, in 2021.","It observes infrared light from 1.5 million km away.","Its gold mirror is 6.5 metres across.","It sees galaxies from soon after the Big Bang.","A tennis-court-sized sunshield keeps it near -233 C.","It found carbon dioxide on an exoplanet in 2022."]},{"key":"whirlpool","name":"WHIRLPOOL GALAXY","kind":"GALAXY","facts":["A grand design spiral 23 million light-years away.","It is interacting with a smaller companion, NGC 5195.","It is catalogued as M51.","Its spiral arms are laced with star formation.","It was the first galaxy recognised as a spiral, in 1845.","It is visible with binoculars from dark sites."]},{"key":"voyagerrecord","name":"GOLDEN RECORD","kind":"OBJECT","facts":["A gold-plated disc carried by both Voyager probes.","It holds sounds and music from Earth.","It includes greetings in 55 languages.","Its cover shows how to play it and where Earth is.","It was designed by Carl Sagan's team.","It will outlast the probes by billions of years."]},{"key":"titan","name":"TITAN","kind":"MOON","facts":["The only moon with a thick atmosphere.","Its air is nitrogen, thicker than Earth's.","Methane rain falls and forms lakes and rivers.","It is larger than the planet Mercury.","Huygens landed on it in 2005.","NASA's Dragonfly rotorcraft is planned to fly there."]},{"key":"cassini","name":"CASSINI","kind":"SPACECRAFT","facts":["It orbited Saturn from 2004 to 2017.","It dropped the Huygens probe onto Titan.","It discovered jets of water at Enceladus.","It sent back over 450,000 images.","It ended by diving into Saturn's atmosphere.","Its mission lasted 20 years in total."]},{"key":"sombrero","name":"SOMBRERO GALAXY","kind":"GALAXY","facts":["An edge-on galaxy 31 million light-years away.","It is named for its hat-like dust lane.","It holds about 800 billion stars.","A supermassive black hole sits at its centre.","It is catalogued as M104.","It is one of the most massive galaxies nearby."]},{"key":"pioneer10","name":"PIONEER 10","kind":"SPACECRAFT","facts":["The first spacecraft to cross the asteroid belt.","It flew past Jupiter in 1973.","It was the first probe to leave the solar system.","It carries a plaque showing humans and Earth's ","kind":"MOON","facts":["One hemisphere is coal black, the other snow white.","A ridge 13 km high runs along its equator.","It orbits Saturn tilted, unlike most moons.","It is 1,470 km across.","The dark side is dust swept up from another moon.","Giovanni Cassini found it in 1671."]},{"key":"iss","name":"INTERNATIONAL SPACE STATION","kind":"SPACECRAFT","facts":["It circles Earth every 90 minutes at 28,000 km/h.","It has been continuously crewed since November 2000.","It is about 400 km above the ground.","It is visible from Earth as a bright moving star.","Its solar arrays span about 100 metres.","It is planned to be deorbited around 2030."]},{"key":"smc","name":"SMALL MAGELLANIC CLOUD","kind":"GALAXY","facts":["A dwarf galaxy orbiting the Milky Way.","It is about 200,000 light-years away.","It pairs with the Large Magellanic Cloud in the southern sky.","It holds a few billion stars.","It is being stretched by tidal forces.","Magellan's crew recorded it in 1519."]},{"key":"starlink","name":"STARLINK","kind":"SPACECRAFT","facts":["A constellation of thousands of small internet satellites.","They orbit about 550 km above Earth.","They are visible as trains of moving lights after launch.","They raise concern about light pollution for astronomers.","They burn up in the atmosphere at the end of life.","Thousands more are planned."]},{"key":"triton","name":"TRITON","kind":"MOON","facts":["It orbits Neptune backwards, so it was probably captured.","Nitrogen geysers erupt from its surface.","Its surface is -235 C, among the coldest measured.","Voyager 2 photographed it in 1989.","It is slowly spiralling in toward Neptune.","It is 2,707 km across, larger than Pluto."]},{"key":"sgra","name":"SAGITTARIUS A*","kind":"BLACKHOLE","facts":["The supermassive black hole at the Milky Way's centre.","It holds about 4 million times the Sun's mass.","It is 27,000 light-years away.","Its image was released in 2022.","Stars whip around it at thousands of km/s.","It is quiet now, but once th cliffs 20 km high.","Verona Rupes is the tallest cliff known.","It is only 471 km across.","It may have been shattered and reassembled.","Voyager 2 photographed it in 1986.","It orbits Uranus in 1.4 days."]},{"key":"cartwheel","name":"CARTWHEEL GALAXY","kind":"GALAXY","facts":["A ring galaxy 500 million light-years away.","A smaller galaxy punched through its centre.","The impact sent a wave of star formation outward.","It is catalogued as ESO 350-40.","Its ring is 150,000 light-years across.","Hubble imaged it in 1995."]},{"key":"solarwind","name":"SOLAR WIND","kind":"REGION","facts":["A stream of charged particles flowing from the Sun.","It travels at 400 to 800 km/s.","It shapes comet tails away from the Sun.","It inflates a bubble around the solar system.","It can disrupt satellites and power grids.","Voyager probes measured it until they crossed the heliopause."]},{"key":"phobos","name":"PHOBOS","kind":"MOON","facts":["It orbits Mars in just 7 hours 39 minutes.","It rises in the west and sets in the east.","It is 22 km across and slowly falling inward.","It will break apart or crash in about 50 million years.","Its surface is dusty and grooved.","It was found in 1877 by Asaph Hall."]},{"key":"blackeye","name":"BLACK EYE GALAXY","kind":"GALAXY","facts":["A spiral galaxy 17 million light-years away.","A dark dust lane crosses its bright core.","It is catalogued as M64.","Its outer gas rotates the opposite way to its inner gas.","That suggests it swallowed a smaller galaxy.","It is visible with a small telescope."]},{"key":"deimos","name":"DEIMOS","kind":"MOON","facts":["The smaller moon of Mars, 12 km across.","Its surface is smoother than Phobos.","It orbits Mars every 30 hours.","It may be a captured asteroid.","It was found in 1877, six days after Phobos.","From Mars it looks like a bright star."]},{"key":"hoags","name":"HOAG'S OBJECT","kind":"GALAXY","facts":["A rare ring galaxy 600 million light-years away.","A bright ring of stars surrounds a separate core.","It is about 120,000 light-years across.","Its shape may come from a past collision.","It was discovered in 1950.","Another ring galaxy appears inside its ring."]},{"key":"voyager1","name":"VOYAGER 1","kind":"SPACECRAFT","facts":["The most distant human-made object, past 170 AU.","Its radio signal takes over 23 hours to reach us.","Launched in 1977, it flew past Jupiter and Saturn.","It crossed into interstellar space in 2012.","It carries the Golden Record of Earth sounds.","Its power should last into the 2030s."]},{"key":"ic1101","name":"IC 1101","kind":"GALAXY","facts":["One of the largest galaxies known.","It spans about 4 million light-years.","It holds over a trillion stars.","It sits about a billion light-years away.","It is a supergiant elliptical galaxy.","It dominates the cluster Abell 2029."]},{"key":"voyager2","name":"VOYAGER 2","kind":"SPACECRAFT","facts":["The only probe to visit Uranus and Neptune.","It entered interstellar space in 2018.","It launched in 1977, before Voyager 1.","It flew past Jupiter, Saturn, Uranus and Neptune.","It is now over 140 AU from the Sun.","It also carries a Golden Record."]},{"key":"m87gal","name":"MESSIER 87","kind":"GALAXY","facts":["A giant elliptical galaxy 55 million light-years away.","It holds about a trillion stars.","Its central black hole was the first ever photographed.","A jet of plasma shoots 5,000 light-years from its core.","It sits at the centre of the Virgo Cluster.","It is visible with a small telescope."]},{"key":"newhorizons","name":"NEW HORIZONS","kind":"SPACECRAFT","facts":["It flew past Pluto in July 2015.","It later visited Arrokoth, a Kuiper Belt object.","Launched in 2006, it is the fastest launch ever.","It crossed Neptune's orbit in 2014.","It is now exploring the outer Kuiper Belt.","Its images revealed Pluto's nitrogen glaciers."]},{"key":"virgocluster","name":"VIRGO CLUSTER","kind":"CLUSTER","facts":["The nearest large galaxy cluster.","It holds over 1,300 galaxies.","It is about 54 million light-years away.","Its gravity pulls on the Local Group.","M87 sits at its centre.","It spans about 15 million light-years."]},{"key":"parker","name":"PARKER SOLAR PROBE","kind":"SPACECRAFT","facts":["The fastest object ever built, near 690,000 km/h.","It flies closer to the Sun than any spacecraft.","Its heat shield endures about 1,400 C.","It has flown through the Sun's corona.","Launched in 2018, it uses Venus flybys to tighten its orbit.","It measures the solar wind at its source."]},{"key":"localgroup","name":"LOCAL GROUP","kind":"CLUSTER","facts":["The group of galaxies that includes the Milky Way.","It holds more than 80 galaxies.","Andromeda and the Milky Way are its two largest members.","It spans about 10 million light-years.","Most of its members are small dwarf galaxies.","It is part of the larger Virgo Supercluster."]},{"key":"juno","name":"JUNO","kind":"SPACECRAFT","facts":["It has orbited Jupiter since 2016.","Its instruments peer beneath Jupiter's clouds.","It found the core is bigger and fuzzier than expected.","Solar powered, it is the farthest solar-powered probe.","It skims just 4,200 km above the cloud tops.","Its images show cyclones at the poles."]}]}

<script>
(function(){
"use strict";
const D = window.TOPIA_DATA;
const CATALOG = (D && D.catalog) || [];
let LIVE_TLE = null;  // set to {count, at} when a live CelesTrak fetch succeeds
const cv = document.getElementById("c");
const ctx = cv.getContext("2d", {alpha:false});
let W=1280, H=720, S=1, OX=0, OY=0;

function resize(){
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  W = Math.round(window.innerWidth * dpr);
  H = Math.round(window.innerHeight * dpr);
  cv.width = W; cv.height = H;
  S = Math.min(W/1280, H/720);
  OX = (W - 1280*S)/2; OY = (H - 720*S)/2;
}
window.addEventListener("resize", resize);
resize();

// ---------------------------------------------------------------- data prep
const AU_KM = 149597870.7, LIGHT_S_PER_AU = 499.004784;
const D2R = Math.PI/180;
const EPOCH_MS = Date.parse(D.epochISO);

const BODIES = D.bodies.map(b => Object.assign({}, b, {p0:b.p.slice()}));
const CRAFT  = D.craft.map(c => Object.assign({}, c, {p0:c.p.slice(), v0:c.v.slice()}));
const BYKEY = {};
BODIES.forEach(b => BYKEY[b.key]=b);
CRAFT.forEach(c => BYKEY[c.key]=c);

function kepler(el, dtDays){
  const a=el.a, e=el.e, i=el.i*D2R, om=el.om*D2R, w=el.w*D2R;
  const M = (el.ma*D2R + el.n*D2R*dtDays) % (2*Math.PI);
  let E = M;
  for(let k=0;k<6;k++){ E = E - (E - e*Math.sin(E) - M)/(1 - e*Math.cos(E)); }
  const xv = a*(Math.cos(E)-e), yv = a*Math.sqrt(1-e*e)*Math.sin(E);
  const cw=Math.cos(w), sw=Math.sin(w), ci=Math.cos(i), si=Math.sin(i), co=Math.cos(om), so=Math.sin(om);
  const x1 = xv*cw - yv*sw, y1 = xv*sw + yv*cw;
  const y2 = y1*ci, z2 = y1*si;
  return [x1*co - y2*so, x1*so + y2*co, z2];
}
function orbitPoints(el, n){
  const pts=[]; const a=el.a, e=el.e, i=el.i*D2R, om=el.om*D2R, w=el.w*D2R;
  const cw=Math.cos(w), sw=Math.sin(w), ci=Math.cos(i), si=Math.sin(i), co=Math.cos(om), so=Math.sin(om);
  for(let k=0;k<=n;k++){
    const E = k/n*2*Math.PI;
    const xv=a*(Math.cos(E)-e), yv=a*Math.sqrt(1-e*e)*Math.sin(E);
    const x1=xv*cw-yv*sw, y1=xv*sw+yv*cw;
    const y2=y1*ci, z2=y1*si;
    pts.push([x1*co-y2*so, x1*so+y2*co, z2]);
  }
  return pts;
}
BODIES.forEach(b => { if(b.a) b.orbit = orbitPoints(b, 240); });

function updatePositions(dtDays){
  BODIES.forEach(b => {
    if(b.key === "sun"){ b.p=[0,0,0]; return; }
    const p = kepler(b, dtDays);
    b.p = p;
  });
  CRAFT.forEach(c => {
    c.p = [c.p0[0]+c.v0[0]*dtDays, c.p0[1]+c.v0[1]*dtDays, c.p0[2]+c.v0[2]*dtDays];
  });
}

// ---------------------------------------------------------------- TLE
const GM = 398600.4418, RE = 6371.0;
function tleState(t, dtDays){
  const nRad = t.n*2*Math.PI;
  const a = Math.pow(GM/Math.pow(nRad/86400,2), 1/3);
  const M = (t.ma*D2R + nRad*dtDays) % (2*Math.PI);
  const e = t.ecc;
  let E = M;
  for(let k=0;k<6;k++){ E = E - (E-e*Math.sin(E)-M)/(1-e*Math.cos(E)); }
  return {a, alt:a-RE, E, period:1440/t.n,
          ang: (E/D2R + t.raan + t.argp) % 360};
}

// ---------------------------------------------------------------- camera
const FOV = 40;
const FACT_SEC = 30;   // one verified fact every 30 seconds
const STOPS = [];
let T = 0;
function addStop(s){ s.start = T; T += s.dur; STOPS.push(s); }
function hashKey(k){ let x=0; for(let i=0;i<k.length;i++) x=(x*131+k.charCodeAt(i))|0; return Math.abs(x); }
addStop({key:"intro", dur:14, dist:44, el:26, phase:null, shift:0, map:false});
for(const o of CATALOG){
  const m = BYKEY[o.key];
  const r = m ? Math.hypot(m.p[0],m.p[1],m.p[2]) : 0;
  const h = hashKey(o.key);
  let dist, el, phase, shift = 0.08;
  if(!m){ dist = 300; el = 12 + (h%10); phase = null; }
  else if(o.kind === "STAR"){ dist = 3.4; el = 19; phase = null; }
  else if(o.kind === "SPACECRAFT"){ dist = Math.max(1.6, r*0.55); el = 16 + (h%6); phase = 45 + (h%25); }
  else { dist = Math.max(1.8, Math.min(9, r*0.45+1.3)); el = 17 + (h%8); phase = 40 + (h%25); }
  const genN = m ? (m.a ? 10 : 8) : 0;
  addStop({key:o.key, dur:((o.facts||[]).length + genN)*FACT_SEC, dist, el, phase, shift, obj:o, map:!!m});
}
addStop({key:"outro", dur:10, dist:44, el:26, phase:null, shift:0, map:false});
const CYCLE = T;
const TR = 2.2;

function smoothstep(u){ u=Math.max(0,Math.min(1,u)); return u*u*u*(u*(u*6-15)+10); }
function rotZ(v,a){ const c=Math.cos(a), s=Math.sin(a); return [v[0]*c-v[1]*s, v[0]*s+v[1]*c, v[2]]; }
function norm(v){ const n=Math.hypot(v[0],v[1],v[2])||1; return [v[0]/n,v[1]/n,v[2]/n]; }
function slerp(a,b,u){
  const d = Math.max(-1,Math.min(1, a[0]*b[0]+a[1]*b[1]+a[2]*b[2]));
  const om = Math.acos(d);
  if(om < 1e-5) return a;
  const s1 = Math.sin((1-u)*om)/Math.sin(om), s2 = Math.sin(u*om)/Math.sin(om);
  return norm([a[0]*s1+b[0]*s2, a[1]*s1+b[1]*s2, a[2]*s1+b[2]*s2]);
}
function stopDir(s){
  const obj = BYKEY[s.key];
  if(!obj || s.phase === null){
    const az = 22*D2R, el = s.el*D2R;
    return [Math.cos(el)*Math.cos(az), Math.cos(el)*Math.sin(az), Math.sin(el)];
  }
  const p = obj.p;
  let sdir = norm([-p[0],-p[1],-p[2]]);
  let perp = norm([sdir[1]*1 - sdir[2]*0, sdir[2]*0 - sdir[0]*1, 0]);
  if(Math.hypot(perp[0],perp[1],perp[2]) < 1e-6) perp = [0,1,0];
  const ph = s.phase*D2R, el = s.el*D2R;
  let horiz = [Math.cos(ph)*sdir[0]+Math.sin(ph)*perp[0],
               Math.cos(ph)*sdir[1]+Math.sin(ph)*perp[1],
               Math.cos(ph)*sdir[2]+Math.sin(ph)*perp[2]];
  horiz = norm(horiz);
  return norm([Math.cos(el)*horiz[0], Math.cos(el)*horiz[1], Math.cos(el)*horiz[2]+Math.sin(el)]);
}

function cameraAt(tt){
  const t = tt % CYCLE;
  let i = 0;
  for(let k=0;k<STOPS.length;k++){ if(t >= STOPS[k].start) i = k; }
  const s = STOPS[i], prev = STOPS[Math.max(0,i-1)];
  const u = i === 0 ? 1 : smoothstep((t - s.start)/TR);
  const cur = BYKEY[s.key], pre = BYKEY[prev.key];
  const tgtA = cur ? cur.p : [0,0,0], tgtB = pre ? pre.p : tgtA;
  let target = [tgtB[0]*(1-u)+tgtA[0]*u, tgtB[1]*(1-u)+tgtA[1]*u, tgtB[2]*(1-u)+tgtA[2]*u];
  const dist = Math.exp(Math.log(prev.dist)*(1-u) + Math.log(s.dist)*u);
  let dir = slerp(stopDir(prev), stopDir(s), u);
  dir = rotZ(dir, 0.010*(t - s.start));
  const fwd = norm([-dir[0],-dir[1],-dir[2]]);
  let rt = [fwd[1]*1-fwd[2]*0, fwd[2]*0-fwd[0]*1, 0];
  if(Math.hypot(rt[0],rt[1])<1e-8) rt=[1,0,0];
  rt = norm(rt);
  const up = [rt[1]*fwd[2]-rt[2]*fwd[1], rt[2]*fwd[0]-rt[0]*fwd[2], rt[0]*fwd[1]-rt[1]*fwd[0]];
  const viewH = 2*dist*Math.tan(FOV*D2R/2), viewW = viewH*(1280/720);
  const sh = s.shift||0;
  target = [target[0]+rt[0]*sh*viewW, target[1]+rt[1]*sh*viewW, target[2]+rt[2]*sh*viewW];
  const pos = [target[0]+dir[0]*dist, target[1]+dir[1]*dist, target[2]+dir[2]*dist];
  return {i, s, t, pos, dir, target, dist, rt, up, fwd,
          fpx:(720/2)/Math.tan(FOV*D2R/2)};
}
function project(cam, p){
  const rel = [p[0]-cam.pos[0], p[1]-cam.pos[1], p[2]-cam.pos[2]];
  const x = rel[0]*cam.rt[0]+rel[1]*cam.rt[1]+rel[2]*cam.rt[2];
  const y = rel[0]*cam.up[0]+rel[1]*cam.up[1]+rel[2]*cam.up[2];
  const z = rel[0]*cam.fwd[0]+rel[1]*cam.fwd[1]+rel[2]*cam.fwd[2];
  if(z <= 1e-6) return null;
  return {x:640 + cam.fpx*x/z, y:360 - cam.fpx*y/z, z};
}

// ---------------------------------------------------------------- stars
const STARS = [];
(function(){
  let seed = 12345;
  function rnd(){ seed = (seed*1664525+1013904223) % 4294967296; return seed/4294967296; }
  for(let i=0;i<900;i++){
    const u = rnd()*2-1, th = rnd()*Math.PI*2, r = Math.sqrt(1-u*u);
    const m = Math.pow(rnd(), 2.6);
    STARS.push({d:[r*Math.cos(th), r*Math.sin(th), u], m, ph:rnd()*6.283,
                tint: rnd()<0.25 ? [0.78,0.86,1.15] : (rnd()<0.2 ? [1.15,1.02,0.82] : [1,1,1])});
  }
})();

// ---------------------------------------------------------------- drawing
function glow(x,y,r,color,a){
  const g = ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0, "rgba("+color+","+a+")");
  g.addColorStop(0.45, "rgba("+color+","+(a*0.35)+")");
  g.addColorStop(1, "rgba("+color+",0)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x,y,r,0,6.2832); ctx.fill();
}

function drawStars(cam, tSec){
  for(const s of STARS){
    const z = s.d[0]*cam.fwd[0]+s.d[1]*cam.fwd[1]+s.d[2]*cam.fwd[2];
    if(z <= 0.02) continue;
    const x = 640 + (s.d[0]*cam.rt[0]+s.d[1]*cam.rt[1]+s.d[2]*cam.rt[2])/z*cam.fpx;
    const y = 360 - (s.d[0]*cam.up[0]+s.d[1]*cam.up[1]+s.d[2]*cam.up[2])/z*cam.fpx;
    if(x<-10||x>1290||y<-10||y>730) continue;
    const tw = 0.82+0.18*Math.sin(s.ph + tSec*1.7);
    const a = Math.min(1, (0.3+0.9*s.m)*tw);
    ctx.fillStyle = "rgba("+Math.round(255*s.tint[0])+","+Math.round(255*s.tint[1])+","+Math.round(255*s.tint[2])+","+a+")";
    const r = 0.6+1.7*s.m;
    ctx.beginPath(); ctx.arc(x,y,r,0,6.2832); ctx.fill();
  }
}

function drawOrbits(cam, focused){
  ctx.lineWidth = 0.9;
  for(const b of BODIES){
    if(!b.orbit) continue;
    const foc = (b.key === focused);
    ctx.strokeStyle = foc ? "rgba(120,180,220,0.55)" : "rgba(86,132,178,0.22)";
    ctx.beginPath();
    let started = false;
    for(const p of b.orbit){
      const q = project(cam, p);
      if(!q){ started=false; continue; }
      if(!started){ ctx.moveTo(q.x,q.y); started=true; } else { ctx.lineTo(q.x,q.y); }
    }
    ctx.stroke();
  }
}

function drawBody(cam, b, focused, tSec){
  const q = project(cam, b.p);
  if(!q) return null;
  const foc = focused ? 1 : 0;
  if(b.key === "sun"){
    const d = Math.hypot(cam.pos[0]-0, cam.pos[1]-0, cam.pos[2]-0);
    const sc = Math.min(1, Math.max(0.05, 3.4/d));
    glow(q.x,q.y, 170*sc, "255,170,90", 0.26);
    glow(q.x,q.y, 90*sc, "255,214,150", 0.55);
    glow(q.x,q.y, 30*sc, "255,245,220", 0.9);
    if(foc){
      const r = 56;
      const g = ctx.createRadialGradient(q.x-r*0.15,q.y-r*0.15, r*0.1, q.x,q.y, r);
      g.addColorStop(0,"#fffdf5"); g.addColorStop(0.5,"#ffe9a8"); g.addColorStop(1,"#ff9d3d");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(q.x,q.y,r,0,6.2832); ctx.fill();
    }
    return {x:q.x, y:q.y, r: foc?56:4};
  }
  const col = b.color;
  const base = foc ? 52 : 4.5;
  glow(q.x,q.y, base*5.5, col.join(","), foc?0.30:0.35);
  if(foc){
    const r = b.key==="jupiter"?64:(b.key==="saturn"?56:(b.key==="earth"?50:44));
    // planet disc with a terminator
    const g = ctx.createRadialGradient(q.x-r*0.35,q.y-r*0.35, r*0.08, q.x,q.y, r*1.05);
    g.addColorStop(0, "rgb("+Math.min(255,col[0]*1.15|0)+","+Math.min(255,col[1]*1.15|0)+","+Math.min(255,col[2]*1.15|0)+")");
    g.addColorStop(0.62, "rgb("+col[0]+","+col[1]+","+col[2]+")");
    g.addColorStop(1, "rgba(10,14,22,1)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(q.x,q.y,r,0,6.2832); ctx.fill();
    if(b.key==="jupiter"||b.key==="saturn"){
      ctx.save(); ctx.beginPath(); ctx.arc(q.x,q.y,r,0,6.2832); ctx.clip();
      for(let k=-4;k<=4;k++){
        const yy = q.y + k*r*0.21;
        ctx.fillStyle = k%2 ? "rgba(120,84,52,0.18)" : "rgba(255,236,200,0.12)";
        ctx.fillRect(q.x-r, yy, 2*r, r*0.10);
      }
      ctx.restore();
      if(b.key==="saturn"){
        ctx.strokeStyle="rgba(232,220,196,0.55)"; ctx.lineWidth=3;
        for(const rr of [1.35,1.55,1.75,1.95]){
          ctx.beginPath(); ctx.ellipse(q.x,q.y,r*rr,r*rr*0.32,0,0,6.2832); ctx.stroke();
        }
      }
    }
    return {x:q.x, y:q.y, r};
  }
  ctx.fillStyle = "rgb("+col[0]+","+col[1]+","+col[2]+")";
  ctx.beginPath(); ctx.arc(q.x,q.y,3.2,0,6.2832); ctx.fill();
  return {x:q.x, y:q.y, r:3.2};
}

function drawCraft(cam, c, focused){
  const q = project(cam, c.p);
  if(!q) return null;
  const col = c.color.join(",");
  // trail
  const back = [c.p[0]-c.v0[0]*8, c.p[1]-c.v0[1]*8, c.p[2]-c.v0[2]*8];
  const qb = project(cam, back);
  if(qb){
    ctx.strokeStyle = "rgba("+col+",0.35)";
    ctx.setLineDash([3,6]); ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(q.x,q.y); ctx.lineTo(qb.x,qb.y); ctx.stroke();
    ctx.setLineDash([]);
  }
  glow(q.x,q.y, focused?26:14, col, 0.75);
  ctx.strokeStyle = "rgba("+col+",0.95)"; ctx.lineWidth=1.6;
  const r = focused?9:6;
  ctx.beginPath();
  ctx.moveTo(q.x,q.y-r); ctx.lineTo(q.x+r,q.y); ctx.lineTo(q.x,q.y+r); ctx.lineTo(q.x-r,q.y); ctx.closePath(); ctx.stroke();
  return {x:q.x,y:q.y,r};
}

// ---------------------------------------------------------------- HUD
function fmtDist(au){ return au<10 ? au.toFixed(2)+" AU" : au.toFixed(1)+" AU"; }
function fmtLight(au){
  const s = au*LIGHT_S_PER_AU;
  if(s >= 3600){ const h=Math.floor(s/3600), m=Math.round((s-h*3600)/60); return h+" h "+String(m).padStart(2,"0")+" min"; }
  return (s/60).toFixed(1)+" min";
}
function tracked(x,y,text,font,color,tr){
  ctx.font = font; ctx.fillStyle = color;
  let cx = x;
  for(const ch of text){ ctx.fillText(ch, cx, y); cx += ctx.measureText(ch).width + (tr||0); }
  return cx;
}
function trackedWidth(text,font,tr){
  ctx.font = font; let w=0;
  for(const ch of text){ w += ctx.measureText(ch).width + (tr||0); }
  return w - (tr||0);
}
function trackedRight(x,y,text,font,color,tr){
  const w = trackedWidth(text,font,tr);
  tracked(x-w,y,text,font,color,tr);
}
function trackedCenter(x,y,text,font,color,tr){
  const w = trackedWidth(text,font,tr);
  tracked(x-w/2,y,text,font,color,tr);
}
function wrapText(text, font, maxW){
  ctx.font = font;
  const words = text.split(" "); const lines=[]; let cur="";
  for(const w of words){
    const t = (cur+" "+w).trim();
    if(ctx.measureText(t).width <= maxW) cur = t;
    else { if(cur) lines.push(cur); cur = w; }
  }
  if(cur) lines.push(cur);
  return lines;
}

function drawHUD(cam, tSec, now){
  const st = cam.s;
  const focusedKey = st.key;
  const focusedObj = st.obj || BYKEY[focusedKey] || null;
  // scrim
  const g = ctx.createLinearGradient(0, 720, 0, 470);
  g.addColorStop(0,"rgba(3,5,10,0.90)"); g.addColorStop(1,"rgba(3,5,10,0)");
  ctx.fillStyle = g; ctx.fillRect(0,470,1280,250);

  const F = "600 34px 'Noto Sans', system-ui, sans-serif";
  tracked(40, 56, "TOPIA", "700 34px 'Noto Sans', system-ui, sans-serif", "#f2f6fc", 4);
  ctx.fillStyle = "#ff6054";
  const pulse = 0.55+0.45*Math.sin(tSec*2.6);
  ctx.globalAlpha = pulse;
  ctx.beginPath(); ctx.arc(46, 76, 5, 0, 6.2832); ctx.fill();
  ctx.globalAlpha = 1;
  tracked(60, 82, "LIVE SOLAR SYSTEM", "600 15px 'Noto Sans', system-ui, sans-serif", "#80d6ee", 2.6);

  // clock
  const utc = new Date(now);
  const hh = String(utc.getUTCHours()).padStart(2,"0");
  const mm = String(utc.getUTCMinutes()).padStart(2,"0");
  const ss = String(utc.getUTCSeconds()).padStart(2,"0");
  const dstr = utc.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric",timeZone:"UTC"}).toUpperCase();
  trackedRight(1240, 48, hh+":"+mm+":"+ss+" UTC", "600 20px 'Noto Sans Mono', monospace", "#e2ebf5", 0.5);
  trackedRight(1240, 72, dstr, "500 14px 'Noto Sans', system-ui, sans-serif", "#9fb3c8", 1.4);
  trackedRight(1240, 94, "DATA  NASA/JPL HORIZONS  \u00b7  CELESTRAK" + (LIVE_TLE ? "  \u00b7  LIVE TLE " + LIVE_TLE : "") + "  \u00b7  CRAFT POSITIONS ESTIMATED", "500 13px 'Noto Sans', system-ui, sans-serif", LIVE_TLE ? "#7fe0b0" : "#6f8296", 1.0);

  // object card
  if(focusedObj){
    const facts = (focusedObj.facts || []).concat(BYKEY[focusedObj.key] ? genLines(BYKEY[focusedObj.key]) : []);
    const fi = Math.min(Math.max(0, facts.length-1), Math.max(0, Math.floor((tSec - st.start)/FACT_SEC)));
    const m = BYKEY[focusedObj.key];
    const r_au = m ? Math.hypot(m.p[0], m.p[1], m.p[2]) : 0;
    window.TOPIA_FACT = fi; window.TOPIA_LINES = facts.length;
    window.TOPIA_KEY = focusedObj.key + ":" + fi;
    tracked(40, 566, focusedObj.kind + (m ? "  \u00b7  LIVE MAP" : "  \u00b7  CATALOGUE"), "600 14px 'Noto Sans', system-ui, sans-serif", "#80d6ee", 3.0);
    tracked(40, 612, focusedObj.name, "700 44px 'Noto Sans', system-ui, sans-serif", "#f4f8fd", 2.4);
    if(facts.length) trackedRight(1240, 566, "FACT " + (fi+1) + " / " + facts.length, "600 15px 'Noto Sans Mono', monospace", "#7fe0b0", 1.4);
    const sub = m ? (focusedObj.key === "sun" ? "OUR STAR  \u00b7  ORIGIN OF THE MAP"
                      : fmtDist(r_au)+" FROM THE SUN  \u00b7  " + (m.v0 ? "EST. POSITION" : "LIGHT "+fmtLight(r_au)))
                  : "DEEP FIELD  \u00b7  NO LIVE POSITION";
    ctx.font = "500 17px 'Noto Sans Mono', monospace"; ctx.fillStyle = "#a8bdd2";
    ctx.fillText(sub, 40, 640);
    let fact = facts[fi] || "";
    if(fact.indexOf("{lt}") >= 0) fact = fact.replace("{lt}", fmtLight(r_au));
    window.TOPIA_LINE = fact;
    // spoken block: fills most of the 30 s slot, every number still live data
    if(m){
      const pool = genLines(m).filter(x => x !== fact);
      const parts = [focusedObj.name + ".", pool[0] || "", pool[1] || "", fact];
      let words = parts.join(" ").split(/\s+/).length, k = 2;
      while(words < 52 && k < pool.length){ parts.push(pool[k]); words += pool[k].split(/\s+/).length; k++; }
      window.TOPIA_SPEECH = parts.filter(Boolean).join(" ")
        + (m.v0 ? " Its position here is estimated from its last JPL fix plus its velocity since then." : "");
    } else {
      window.TOPIA_SPEECH = focusedObj.name + ". " + fact;
    }
    const lines = wrapText(fact, "300 22px 'Noto Sans', system-ui, sans-serif", 800);
    ctx.font = "300 22px 'Noto Sans', system-ui, sans-serif"; ctx.fillStyle = "#dbe6f2";
    lines.slice(0,3).forEach((ln,k) => ctx.fillText(ln, 40, 674 + k*29));
  }

  // credit
  trackedRight(1240, 690, "BODY SIZES NOT TO SCALE", "500 13px 'Noto Sans', system-ui, sans-serif", "#6f8296", 1.2);

  // intro / outro titles handled by cycle start
  if(st.key === "intro"){
    const a = Math.min(1, Math.max(0, Math.min((tSec-st.start-0.6)/1.4, (st.start+st.dur-1.0-tSec)/1.2)));
    if(a > 0.01){
      ctx.globalAlpha = a;
      trackedCenter(640, 250, "TOPIA", "700 66px 'Noto Sans', system-ui, sans-serif", "#f4f8fd", 12);
      ctx.fillStyle = "#ffc478"; ctx.fillRect(520, 272, 240, 2);
      trackedCenter(640, 308, "A LIVE MAP OF THE SOLAR SYSTEM", "600 18px 'Noto Sans', system-ui, sans-serif", "#80d6ee", 4);
      trackedCenter(640, 340, "REAL POSITIONS  \u00b7  NASA JPL HORIZONS  \u00b7  CELESTRAK", "500 14px 'Noto Sans', system-ui, sans-serif", "#9fb3c8", 1.6);
      ctx.globalAlpha = 1;
    }
  }
}

function drawLeoInset(now, alpha){
  if(alpha <= 0.01) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  const x0 = 940, y0 = 130, w = 300, h = 300;
  ctx.fillStyle = "rgba(8,13,22,0.82)";
  ctx.strokeStyle = "rgba(60,92,120,0.6)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(x0,y0,w,h,6); ctx.fill(); ctx.stroke();
  tracked(x0+16, y0+26, "EARTH ORBIT", "600 14px 'Noto Sans', system-ui, sans-serif", "#80d6ee", 2.2);
  trackedRight(x0+w-16, y0+26, "CELESTRAK TLE", "500 12px 'Noto Sans', system-ui, sans-serif", "#6f8296", 1.0);
  ctx.strokeStyle = "rgba(60,92,120,0.45)";
  ctx.beginPath(); ctx.moveTo(x0+16,y0+38); ctx.lineTo(x0+w-16,y0+38); ctx.stroke();

  const cx = x0+w/2, cy = y0+140, er = 34;
  const g = ctx.createRadialGradient(cx-er*0.3, cy-er*0.3, 4, cx, cy, er);
  g.addColorStop(0,"#3f86c8"); g.addColorStop(1,"#0d2f57");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx,cy,er,0,6.2832); ctx.fill();
  ctx.strokeStyle = "rgba(90,150,210,0.8)"; ctx.stroke();

  const dtDays = (now - Date.parse(D.epochISO))/86400000;
  const rows = [];
  ctx.save();
  ctx.beginPath(); ctx.roundRect(x0+8, y0+44, w-16, 152, 4); ctx.clip();
  const colors = {ISS:[255,210,130], CSS:[170,230,200]};
  let idx = 0;
  for(const t of D.tle){
    const st = tleState(t, dtDays);
    const rr = er + (st.a - RE)*0.115;
    const sq = 0.42 + 0.12*idx;
    ctx.strokeStyle = "rgba(70,110,145,0.5)";
    ctx.beginPath(); ctx.ellipse(cx,cy,rr,rr*sq,0,0,6.2832); ctx.stroke();
    const ang = st.ang*D2R;
    const px = cx + rr*Math.cos(ang), py = cy - rr*sq*Math.sin(ang);
    const col = colors[t.cat] || [150,190,230];
    ctx.fillStyle = "rgb("+col.join(",")+")";
    ctx.beginPath(); ctx.arc(px,py,3.2,0,6.2832); ctx.fill();
    if(rows.length < 3){
      const nm = t.name.length > 13 ? t.name.slice(0,12).trim() + "\u2026" : t.name;
      rows.push([nm, st.alt.toFixed(0)+" km", st.period.toFixed(0)+" min", col]);
    }
    idx++;
  }
  ctx.restore();
  let yy = y0+210;
  for(const [name, alt, per, col] of rows){
    ctx.fillStyle = "rgb("+col.join(",")+")";
    ctx.fillRect(x0+18, yy-10, 9, 9);
    ctx.font = "600 13px 'Noto Sans', system-ui, sans-serif";
    ctx.fillStyle = "#dbe6f2"; ctx.fillText(name, x0+34, yy);
    ctx.font = "500 12px 'Noto Sans Mono', monospace";
    ctx.fillStyle = "#a8bdd2"; ctx.textAlign = "right";
    ctx.fillText(alt, x0+w-18, yy); ctx.textAlign = "left";
    yy += 26;
  }
  ctx.font = "400 11px 'Noto Sans', system-ui, sans-serif"; ctx.fillStyle = "#6f8296";
  ctx.fillText("live TLE propagation", x0+18, y0+h-14);
  ctx.restore();
}

// Lines computed from the live catalogue values at this instant. Every number
// comes from the JPL elements/vectors in data.js or from the clock: nothing here
// is invented, and nothing here is the same twice because the numbers move.
const AU_KM_ = 149597870.7, LTS_PER_AU = 499.004784, AUD_TO_KMS = 1731.456;
function ltText(v){
  if(v < 60) return v.toFixed(0)+" seconds";
  if(v < 3600) return (v/60).toFixed(1)+" minutes";
  return (v/3600).toFixed(2)+" hours";
}
function genLines(m){
  const out = [];
  const e = BYKEY["earth"];
  const p = m.p, r = Math.hypot(p[0],p[1],p[2]);
  const de = e ? Math.hypot(p[0]-e.p[0], p[1]-e.p[1], p[2]-e.p[2]) : r;
  const lon = ((Math.atan2(p[1],p[0])/D2R)+360)%360;
  if(m.key === "sun"){
    const e3 = BYKEY["earth"];
    const re = Math.hypot(e3.p[0],e3.p[1],e3.p[2]);
    out.push("The Sun is the origin of this map: every other position here is measured from it.");
    out.push("Earth sits " + re.toFixed(3) + " AU out right now, on the third orbit.");
    out.push("Sunlight left the surface " + ltText(re*LTS_PER_AU) + " before it reached Earth.");
    out.push("Its diameter is about 109 times Earth's.");
    out.push("Its surface is about 5,500 degrees Celsius, the core about 15 million.");
    out.push("It fuses roughly 600 million tonnes of hydrogen every second.");
    out.push("Its light reaches Neptune in about " + ltText(30.07*LTS_PER_AU) + ".");
    out.push("One full rotation at the equator takes about 24.5 days.");
    return out;
  }
  const kmv = r*AU_KM_/1e6;
  out.push("Right now " + m.name + " is " + r.toFixed(3) + " AU from the Sun, about "
    + (kmv >= 1000 ? (kmv/1000).toFixed(1) + " billion km" : kmv.toFixed(1) + " million km") + ".");
  out.push("Sunlight takes " + ltText(r*LTS_PER_AU) + " to reach it.");
  if(m.key === "earth") out.push("Earth is the reference point for this map: every other distance is measured against it.");
  else if(m.v0) out.push("Tonight it is " + de.toFixed(3) + " AU from Earth, a one-way signal time of " + ltText(de*LTS_PER_AU) + ".");
  else out.push("Tonight it is " + de.toFixed(3) + " AU from Earth, so its light reaches us " + ltText(de*LTS_PER_AU) + " after it leaves.");
  if(m.a){
    const yr = m.period/365.25;
    out.push("One lap around the Sun takes " + (yr < 1 ? Math.round(m.period) + " days" : yr.toFixed(yr < 10 ? 2 : 1) + " years") + ".");
    out.push("Its orbit runs from " + (m.a*(1-m.e)).toFixed(2) + " AU to " + (m.a*(1+m.e)).toFixed(2) + " AU from the Sun, eccentricity " + m.e.toFixed(3) + ".");
    out.push("The orbit is tilted " + m.i.toFixed(2) + " degrees to the plane of the planets.");
    out.push("It advances " + m.n.toFixed(m.n < 1 ? 4 : 2) + " degrees around the Sun each day.");
    out.push("Sunlight out there is " + (1/(r*r)).toFixed(3) + " times as strong as at Earth.");
    out.push("Measured from the Sun it stands at ecliptic longitude " + lon.toFixed(1) + " degrees right now.");
    if(m.key !== "earth") out.push("It is " + r.toFixed(2) + " times Earth's distance from the Sun.");
  } else if(m.v0){
    const v = Math.hypot(m.v0[0], m.v0[1], m.v0[2]) * AUD_TO_KMS;
    const vr = (p[0]*m.v0[0] + p[1]*m.v0[1] + p[2]*m.v0[2]) / (r || 1) * AUD_TO_KMS;
    out.push("It is moving at " + v.toFixed(2) + " km/s relative to the Sun.");
    out.push(vr >= 0 ? "It is still climbing away from the Sun at " + vr.toFixed(2) + " km/s."
                     : "It is falling back toward the Sun at " + Math.abs(vr).toFixed(2) + " km/s.");
    out.push("It covers " + (v*86400/1e6).toFixed(1) + " million km every day.");
    out.push("Earth is " + de.toFixed(2) + " AU behind it tonight.");
    out.push("Its bearing in the ecliptic plane is " + lon.toFixed(1) + " degrees.");
  } else {
    const e2 = BYKEY["earth"];
    out.push("The Sun is the origin of this map.");
    out.push("Earth sits " + Math.hypot(e2.p[0],e2.p[1],e2.p[2]).toFixed(3) + " AU out right now, on the third orbit.");
    out.push("Sunlight at Earth left the surface " + ltText(Math.hypot(e2.p[0],e2.p[1],e2.p[2])*LTS_PER_AU) + " ago.");
    out.push("Its diameter is about 109 times Earth's.");
    out.push("Its surface is about 5,500 degrees Celsius, the core about 15 million.");
    out.push("It fuses roughly 600 million tonnes of hydrogen every second.");
    out.push("Its light reaches Neptune in about " + ltText(30.07*LTS_PER_AU) + ".");
    out.push("One full rotation at the equator takes about 24.5 days.");
  }
  return out;
}

function drawCardPortrait(o, tSec){
  const h = hashKey(o.key);
  const cx = 700, cy = 300, rot = (h%360)*D2R + tSec*0.02;
  const kind = o.kind;
  ctx.save();
  if(kind === "STAR"){
    const r = 44 + (h%26);
    glow(cx,cy, r*4.2, "200,225,255", 0.16);
    glow(cx,cy, r*1.9, "255,250,235", 0.5);
    const g = ctx.createRadialGradient(cx-r*0.2,cy-r*0.2,r*0.1,cx,cy,r);
    g.addColorStop(0,"#ffffff"); g.addColorStop(0.55,"#fff2cf"); g.addColorStop(1,"#ffb45e");
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,r,0,6.2832); ctx.fill();
  } else if(kind === "GALAXY"){
    glow(cx,cy, 200, "190,205,255", 0.15);
    ctx.translate(cx,cy); ctx.rotate(rot);
    for(let k=0;k<3;k++){
      ctx.strokeStyle = "rgba(196,214,255,"+(0.30-k*0.07).toFixed(2)+")"; ctx.lineWidth = 2.4-k*0.5;
      ctx.beginPath(); ctx.ellipse(0,0,128+k*30,58+k*14,0,0,6.2832); ctx.stroke();
    }
    glow(0,0, 48, "255,240,220", 0.8);
  } else if(kind === "NEBULA"){
    for(let k=0;k<4;k++){
      const a = rot + k*1.7;
      glow(cx+Math.cos(a)*72, cy+Math.sin(a)*46, 118, k%2 ? "255,120,150" : "110,180,255", 0.22);
    }
    glow(cx,cy, 88, "240,210,255", 0.26);
  } else if(kind === "CLUSTER"){
    glow(cx,cy, 210, "200,215,255", 0.11);
    for(let k=0;k<9;k++){
      const a = k*2.1 + rot, rr = 26 + (k*37)%118;
      glow(cx+Math.cos(a)*rr, cy+Math.sin(a)*rr*0.7, 22, "235,240,255", 0.6);
    }
  } else if(kind === "EXOPLANET"){
    glow(cx-84, cy, 34, "255,240,200", 0.85);
    const pr = 26 + (h%10);
    const g = ctx.createRadialGradient(cx+86-pr*0.3, cy-pr*0.3, pr*0.1, cx+86, cy, pr);
    g.addColorStop(0,"#9fd0ff"); g.addColorStop(1,"#123a63");
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx+86,cy,pr,0,6.2832); ctx.fill();
    ctx.strokeStyle="rgba(150,190,230,0.32)"; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.ellipse(cx-84,cy,170,54,0,0,6.2832); ctx.stroke();
  } else {
    glow(cx,cy, 160, "150,190,230", 0.13);
    ctx.strokeStyle="rgba(140,190,225,0.45)"; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.arc(cx,cy,80,0,6.2832); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx,cy,124,0,6.2832); ctx.stroke();
  }
  ctx.restore();
}

// ---------------------------------------------------------------- narration
// Browser speech synthesis only: no audio files, no music, silent until the
// visitor taps. It speaks the line that is on screen for the current UTC slot.
const sndBtn = document.getElementById("snd");
let narrOn = false, spokenKey = "", voice = null;
function pickVoice(){
  try{
    const vs = window.speechSynthesis.getVoices() || [];
    voice = vs.find(v => /en[-_]US/i.test(v.lang) && /Google|Samantha|Aria|Zira|Natural/i.test(v.name))
         || vs.find(v => /en[-_]US/i.test(v.lang)) || vs[0] || null;
  }catch(e){ voice = null; }
}
if(window.speechSynthesis){
  pickVoice();
  window.speechSynthesis.addEventListener("voiceschanged", pickVoice);
}
function speakLine(txt){
  if(!window.speechSynthesis || !txt) return;
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(txt);
    if(voice) u.voice = voice;
    u.lang = "en-US"; u.rate = 0.97; u.pitch = 1.0; u.volume = 1.0;
    window.TOPIA_SPOKEN = txt;
    window.speechSynthesis.speak(u);
  }catch(e){ console.warn("speech error", e && e.message); }
}
function narrTick(){
  if(!narrOn) return;
  const key = window.TOPIA_KEY, txt = window.TOPIA_SPEECH || window.TOPIA_LINE;
  if(!key || !txt || key === spokenKey) return;
  spokenKey = key;
  speakLine(txt);
}
if(sndBtn){
  sndBtn.addEventListener("click", () => {
    narrOn = !narrOn;
    sndBtn.dataset.on = narrOn ? "1" : "0";
    sndBtn.setAttribute("aria-pressed", narrOn ? "true" : "false");
    sndBtn.innerHTML = narrOn ? "&#128266; NARRATION ON &mdash; TAP TO STOP" : "&#128266; NARRATION OFF";
    spokenKey = "";
    if(window.speechSynthesis) window.speechSynthesis.cancel();
    if(narrOn) narrTick();
  });
}
setInterval(narrTick, 400);

// ---------------------------------------------------------------- loop
// Wall-clock driven: the cycle position is a function of UTC time, so a refresh
// (or a visitor arriving late) lands on exactly the frame everyone else sees.
const T0PARAM = new URLSearchParams(location.search).get("t0");
let startWall = (T0PARAM === null) ? null : Date.now() - parseFloat(T0PARAM)*1000;
function frameSafe(){ try { frame(); } catch(e){ console.warn("frame error", e && e.message); } requestAnimationFrame(frameSafe); }
function frame(){
  const now = Date.now();
  const tSec = (startWall === null) ? (now/1000) % CYCLE : (now - startWall)/1000;
  window.TOPIA_T = tSec;
  const dtDays = (now - EPOCH_MS)/86400000;
  updatePositions(dtDays);

  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = "#04060d";
  ctx.fillRect(0,0,W,H);
  ctx.setTransform(S,0,0,S,OX,OY);

  const cam = cameraAt(tSec);
  window.TOPIA_STOP = cam.s.key;
  drawStars(cam, tSec);
  const focused = BYKEY[cam.s.key] ? cam.s.key : null;
  if(cam.s.map !== false) drawOrbits(cam, focused);
  if(!cam.s.map && cam.s.obj) drawCardPortrait(cam.s.obj, tSec);

  // bodies far->near
  const items = [];
  if(cam.s.map !== false){
    for(const b of BODIES){ const q = project(cam, b.p); if(q) items.push({z:q.z, kind:"b", obj:b, q}); }
    for(const c of CRAFT){ const q = project(cam, c.p); if(q) items.push({z:q.z, kind:"c", obj:c, q}); }
  }
  items.sort((a,b)=>b.z-a.z);
  const labels = [];
  for(const it of items){
    if(it.kind === "b"){
      const d = drawBody(cam, it.obj, focused === it.obj.key, tSec);
      if(d) labels.push({x:d.x, y:d.y, r:d.r, name:it.obj.name, big:focused===it.obj.key, obj:it.obj});
    } else {
      const d = drawCraft(cam, it.obj, focused === it.obj.key);
      if(d) labels.push({x:d.x, y:d.y, r:d.r, name:it.obj.name, big:focused===it.obj.key, obj:it.obj, craft:true});
    }
  }
  // labels
  const placed = [];
  const introFrame = !cam.s.map;
  const discAnchors = labels.filter(L => L.big && !L.craft && L.r > 20);
  for(const L of labels){
    const big = L.big;
    if(introFrame) continue;   // intro is a title card: no object labels over the title
    const font = big ? "700 22px 'Noto Sans', system-ui, sans-serif" : "500 16px 'Noto Sans', system-ui, sans-serif";
    ctx.font = font;
    const w = ctx.measureText(L.name).width;
    let bx = L.x + (big ? L.r + 18 : 12), by = L.y - (big ? 6 : 12);
    if(bx + w > 1230) bx = L.x - (big ? L.r + 18 : 12) - w;
    if(bx < 20 || by < 60 || by > 660) continue;
    const inInset = (bx + w > 930 && bx < 1252 && by > 120 && by < 445);
    const inTitle = (bx < 330 && by < 125);
    const inClock = (bx + w > 890 && by < 125);
    if(inInset || inTitle || inClock) continue;
    if(by > 536 && bx < 980) continue;   // bottom-left card block owns this area
    if(!big){
      let onDisc = false;
      for(const d of discAnchors){ if(Math.hypot(L.x-d.x, L.y-d.y) < d.r*1.3) onDisc = true; }
      if(onDisc) continue;
      let clash = false;
      for(const pbox of placed){ if(Math.abs((bx+w/2)-pbox[0]) < (w+pbox[2])/2+6 && Math.abs(by-pbox[1]) < 18) clash = true; }
      if(clash) continue;
      placed.push([bx+w/2, by, w]);
    } else { placed.push([bx+w/2, by, w]); }
    if(big){
      ctx.strokeStyle = "rgba(120,200,230,0.35)"; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(L.x + L.r*0.6, L.y); ctx.lineTo(bx-8, L.y); ctx.stroke();
      ctx.fillStyle = "#f4f8fd"; ctx.fillText(L.name, bx, by);
      const r_au = Math.hypot(L.obj.p[0], L.obj.p[1], L.obj.p[2]);
      ctx.font = "500 15px 'Noto Sans Mono', monospace"; ctx.fillStyle = "#8fd6ea";
      ctx.fillText(L.craft ? fmtDist(r_au)+"  \u00b7  light "+fmtLight(r_au) : (L.obj.key==="sun"?"":"")+ (L.obj.key==="sun" ? "" : fmtDist(r_au)), bx, by+20);
    } else {
      ctx.fillStyle = "rgba(196,208,222,0.85)"; ctx.fillText(L.name, bx, by);
    }
  }

  drawHUD(cam, tSec, now);
  const earthFocus = (cam.s.key === "earth") ? 1 : 0;
  drawLeoInset(now, earthFocus);

}

// ---------------------------------------------------------------- live TLE refresh (CelesTrak, CORS-enabled)
const TLE_URL = "https://celestrak.org/NORAD/elements/gp.php?GROUP=stations&FORMAT=json";
function refToPageEpoch(tle, tleEpochMs){
  // re-reference mean anomaly to the page epoch so the shared dtDays works
  const deltaDays = (EPOCH_MS - tleEpochMs) / 86400000;
  tle.ma = ((tle.ma + tle.n * deltaDays * 360) % 360 + 360) % 360;
  return tle;
}
async function refreshTLE(){
  try{
    const ctl = new AbortController();
    const to = setTimeout(() => ctl.abort(), 8000);
    const r = await fetch(TLE_URL, {cache:"no-store", signal:ctl.signal});
    clearTimeout(to);
    if(!r.ok) throw new Error("HTTP " + r.status);
    const arr = await r.json();
    if(!Array.isArray(arr) || !arr.length) throw new Error("empty");
    const out = arr.map(o => refToPageEpoch({
      cat: String(o.NORAD_CAT_ID),
      name: String(o.OBJECT_NAME || o.NORAD_CAT_ID).trim(),
      inc: +o.INCLINATION, raan: +o.RA_OF_ASC_NODE, ecc: +o.ECCENTRICITY,
      argp: +o.ARG_OF_PERICENTER, ma: +o.MEAN_ANOMALY, n: +o.MEAN_MOTION,
      epochDay: 0
    }, Date.parse(o.EPOCH))).filter(t => isFinite(t.n) && isFinite(t.ma));
    if(out.length < 3) throw new Error("too few");
    D.tle = out;
    LIVE_TLE = String(out.length) + " SATS";
  }catch(e){
    LIVE_TLE = null;  // keep the baked snapshot
  }
}
refreshTLE();
setInterval(refreshTLE, 2 * 60 * 60 * 1000);

updatePositions((Date.now() - EPOCH_MS)/86400000);
requestAnimationFrame(frameSafe);
window.TOPIA_READY = true;
})();
</script>
